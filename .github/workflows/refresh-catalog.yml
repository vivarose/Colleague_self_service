name: Refresh catalog on demand
run-name: Catalog refresh ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      refresh_date:
        description: Fixed EST date supplied by the refresh gate
        required: true
        type: string
      request_id:
        description: Refresh gate attempt identifier
        required: true
        type: string

concurrency:
  group: catalog-refresh-and-publication
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      REFRESH_SERVICE_URL: ${{ vars.REFRESH_SERVICE_URL }}
      REFRESH_CALLBACK_SECRET: ${{ secrets.REFRESH_CALLBACK_SECRET }}
      REQUEST_ID: ${{ inputs.request_id }}
      REFRESH_DATE: ${{ inputs.refresh_date }}
    steps:
      - uses: actions/checkout@v4
      - name: Claim this attempt before downloading any source data
        id: claim
        run: python .github/scripts/refresh_callback.py claim
      - uses: actions/setup-python@v5
        if: steps.claim.outputs.proceed == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-refresh.txt
      - name: Install refresh dependencies
        if: steps.claim.outputs.proceed == 'true'
        run: python -m pip install -r requirements-refresh.txt
      - name: Run regression tests
        if: steps.claim.outputs.proceed == 'true'
        run: |
          python -m unittest discover -s tests -v
          node --test tests/corrigendum.test.js refresh-service/worker.test.js
      - name: Download, validate, and build
        if: steps.claim.outputs.proceed == 'true'
        run: python refresh_catalogue.py --date "$REFRESH_DATE"
      - name: Persist the validated catalog and immutable snapshots
        if: steps.claim.outputs.proceed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merged_course_schedule.xlsx courses.html catalog-snapshots source-provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh catalog for $REFRESH_DATE (fixed EST)" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Prepare Pages artifact
        if: steps.claim.outputs.proceed == 'true'
        run: |
          mkdir public
          cp courses.html refresh-config.json public/
          cp courses.html public/index.html
          cp -r catalog-snapshots public/
      - uses: actions/configure-pages@v5
        if: steps.claim.outputs.proceed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.claim.outputs.proceed == 'true'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.claim.outputs.proceed == 'true'
      - name: Report completion to the refresh gate
        if: always() && steps.claim.outputs.proceed == 'true'
        env:
          REFRESH_RESULT: ${{ steps.deployment.outcome == 'success' && 'succeeded' || 'failed' }}
        run: python .github/scripts/refresh_callback.py complete
